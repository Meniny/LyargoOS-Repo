# Package chooser module - lets users select optional software

---
groups:
  - name: "Web Browsers"
    description: "Choose a web browser"
    packages:
      - name: chromium
        description: "Fast, open-source web browser by Google"
        selected: false
      - name: brave
        description: "Privacy-focused browser with ad blocking"
        selected: false

  - name: "Network Tools"
    description: "Proxy and network utilities"
    packages:
      - name: flclash
        description: "Multi-platform proxy client based on ClashMeta"
        selected: false

  - name: "Archive Managers"
    description: "File archiving and compression tools"
    packages:
      - name: peazip
        description: "Free file archiver and compressor with wide format support"
        selected: false

  - name: "Video Editing"
    description: "Video editing and streaming software"
    packages:
      - name: kdenlive
        description: "Feature-rich video editor by KDE"
        selected: false
      - name: obs-studio
        description: "Video recording and live streaming software"
        selected: false
      - name: guvcview
        description: "USB webcam viewer and capture tool"
        selected: false

  - name: "Media Players"
    description: "Audio and video players"
    packages:
      - name: vlc
        description: "Versatile multimedia player supporting most formats"
        selected: true
      - name: smplayer
        description: "Free media player with built-in codecs"
        selected: false
      - name: audacious
        description: "Lightweight audio player"
        selected: false

  - name: "Audio Editing"
    description: "Audio recording and editing"
    packages:
      - name: audacity
        description: "Multi-track audio editor and recorder"
        selected: false

  - name: "Graphics & Design"
    description: "Image editing and illustration tools"
    packages:
      - name: gimp
        description: "GNU Image Manipulation Program"
        selected: false
      - name: inkscape
        description: "Professional vector graphics editor"
        selected: false
      - name: krita
        description: "Digital painting and illustration application by KDE"
        selected: false
      - name: flameshot
        description: "Powerful yet simple-to-use screenshot software"
        selected: true

  - name: "Document Viewers"
    description: "PDF and document readers"
    packages:
      - name: okular
        description: "Universal document viewer by KDE"
        selected: false

  - name: "Text Editors"
    description: "Advanced text editors"
    packages:
      - name: kate
        description: "Advanced text editor by KDE"
        selected: false
