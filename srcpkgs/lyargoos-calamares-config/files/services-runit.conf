# Runit services module for Calamares
# Configures which services are enabled/disabled after installation

---
svDir: /etc/sv
runsvDir: /var/service

services:
  - name: dbus
    mandatory: true
  - name: NetworkManager
    mandatory: true
  - name: elogind
    mandatory: true
  - name: sshd
  - name: chronyd
  - name: polkitd

disable: []
