---
dontChroot: false
timeout: 10

script:
    # Set zsh as default shell for the created user
    - command: "chsh -s /bin/zsh ${USER}"
    # Set zsh as default shell for root
    - command: "chsh -s /bin/zsh root"
    # Ensure user is in wheel group for sudo
    - command: "usermod -aG wheel ${USER}"
    # Enable wheel group in sudoers
    - command: "sed -i 's/^# %wheel ALL=(ALL) ALL/%wheel ALL=(ALL) ALL/' /etc/sudoers"

i18n:
    name: "Set default shell to zsh"
